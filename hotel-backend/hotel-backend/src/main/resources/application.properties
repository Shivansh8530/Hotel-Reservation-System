# --- Server ---
server.port=${PORT:8082}

# --- MongoDB (Required: must be provided via SPRING_DATA_MONGODB_URI env var) ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# --- JWT (Required: must be provided via JWT_SECRET env var, min 32 chars) ---
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://hotel-resevation-8080.web.app,https://hotel-resevation-8080.firebaseapp.com}

# --- Logging ---
logging.level.org.springframework.security=INFO
