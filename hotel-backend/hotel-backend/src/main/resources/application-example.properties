# StayEase Backend - Example Environment Configuration
# Copy this file to application.properties or set these via environment variables in production.

# --- Server Port ---
server.port=8082

# --- MongoDB Atlas Connection String ---
spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<database>?retryWrites=true&w=majority

# --- JWT Signing Key ---
# Must be at least 32 characters for HS256 HMAC encryption (generate with: openssl rand -base64 48)
jwt.secret=<your-strong-random-jwt-secret-min-32-chars>
jwt.expiration.ms=86400000

# --- Allowed CORS Origins (comma-separated) ---
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://hotel-resevation-8080.web.app,https://hotel-resevation-8080.firebaseapp.com

# --- Optional Initial Owner Account Seeding ---
admin.email=owner@stayease.com
admin.password=YourStrongMasterPassword123!

# --- Optional SMTP Configuration for Password Reset Emails ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@stayease.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
