# --- Server ---
server.port=8080

# --- MongoDB ---
spring.data.mongodb.uri=mongodb://localhost:27017/hotelreservation

# --- JWT ---
# IMPORTANT: change this secret before deploying anywhere real.
# Must be at least 32 characters for HS256.
jwt.secret=ChangeThisSecretKeyBeforeDeployingToProductionPlease123
jwt.expiration.ms=86400000

# --- Logging (optional, helpful while learning) ---
logging.level.org.springframework.security=INFO